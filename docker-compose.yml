services:
  piccolo:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: piccolo:latest
    container_name: piccolo
    restart: unless-stopped
    ports:
      - "${PICCOLO_WEB_PORT:-65211}:${PICCOLO_WEB_PORT:-65211}"
    environment:
      PICCOLO_VNC_HOST: ${PICCOLO_VNC_HOST:-host.docker.internal}
      PICCOLO_VNC_PORT: ${PICCOLO_VNC_PORT:-65212}
      PICCOLO_WEB_HOST: 0.0.0.0
      PICCOLO_WEB_PORT: ${PICCOLO_WEB_PORT:-65211}
      PICCOLO_LOG_LEVEL: ${PICCOLO_LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
